<div class="container py-4" style="max-width:720px">

  <div class="d-flex align-items-center mb-4">
    <div>
      <h3 class="mb-0">Historial de versiones</h3>
      <p class="text-muted mb-0" style="font-size:.9rem">Biblioteca USASJ — mejoras publicadas</p>
    </div>
    <span class="badge badge-primary ml-auto" style="font-size:1rem;padding:.5rem .9rem">
      v{{ versionActual.version }} actual
    </span>
  </div>

  <div *ngFor="let r of releases; let primero = first"
       class="d-flex mb-4">

    <!-- Línea de tiempo -->
    <div class="d-flex flex-column align-items-center mr-3" style="min-width:40px">
      <div style="width:14px;height:14px;border-radius:50%;margin-top:4px;flex-shrink:0;"
           [style.background]="primero ? '#1B5A8A' : '#ced4da'"></div>
      <div style="width:2px;flex:1;background:#e9ecef;margin-top:4px"></div>
    </div>

    <!-- Tarjeta de release -->
    <div class="card flex-grow-1 mb-0" [class.border-primary]="primero">
      <div class="card-body py-3">
        <div class="d-flex align-items-start flex-wrap gap-2 mb-2">
          <span class="badge" [style.background]="primero ? '#1B5A8A' : '#6c757d'"
                style="font-size:.8rem;color:#fff">v{{ r.version }}</span>
          <strong>{{ r.titulo }}</strong>
          <span class="badge badge-light ml-auto" style="font-size:.75rem;font-weight:400">
            {{ r.modulo }}
          </span>
        </div>
        <p class="text-muted mb-2" style="font-size:.8rem">{{ r.fecha }}</p>
        <ul class="mb-0 pl-3" style="font-size:.875rem">
          <li *ngFor="let c of r.cambios">{{ c }}</li>
        </ul>
      </div>
    </div>
  </div>

</div>
